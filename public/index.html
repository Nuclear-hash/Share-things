<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ferry — send it across in ten minutes</title>
    <meta
      name="description"
      content="Send documents, photos or a whole movie and share a link or QR code. Files are deleted after ten minutes, or the moment the other side says they have them."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f2f5f9" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Ferry home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 16.5c1.6 0 1.6 1.4 3.2 1.4s1.6-1.4 3.2-1.4 1.6 1.4 3.2 1.4 1.6-1.4 3.2-1.4 1.6 1.4 3.2 1.4" />
            <path d="M5.5 13.5V11h13v2.5" />
            <path d="M8 11V7.5h8V11" />
            <path d="M12 4v3.5" />
          </svg>
        </span>
        <span class="brand-name">Ferry</span>
      </a>
      <a class="header-link" href="/">New crossing</a>
    </header>

    <main id="app" class="app"></main>

    <footer class="site-footer">
      <span>Ferry — send it across, then forget about it.</span>
      <span>Ten minutes, or until they say they have it.</span>
      <span class="credit">Made by Harsh</span>
    </footer>

    <button class="to-top" id="to-top" type="button" aria-label="Back to top" title="Back to top" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5" />
        <path d="m5.5 11.5 6.5-6.5 6.5 6.5" />
      </svg>
    </button>

    <!-- The QR library is loaded on demand, only after a link has been made. -->
    <script src="/app.js" defer></script>
  </body>
</html>
